# M4: self-play league. Starts from the M3 policy; opponents = stationary + FSMs + frozen policy snapshots (PFSP).

run_name: m4_league
seed: 1
init_ckpt: results/m3/ckpt_00500M.pt   # final M3 policy (500M steps, shaping fully annealed)

env:
  num_envs: 4096
  randomize: false                 # hardware *_rand still off (M5)

reward:                            # shaping stays off: M3 already annealed it to 0
  win: 10.0
  loss: -10.0
  draw: -1.0
  approach: 0.0
  push: 0.0
  push_gate_dist: 0.3
  jerk: 0.02
  shaping_anneal_steps: 1

ppo:
  total_steps: 2_000_000_000
  rollout: 64
  gamma: 0.995
  gae_lambda: 0.95
  lr: 2.0e-4
  epochs: 4
  minibatches: 8
  clip: 0.2
  ent_coef: 0.002
  vf_coef: 0.5
  max_grad_norm: 1.0
  init_log_std: -1.5               # pretrained actor: start with little exploration noise
  critic_hidden: [256, 256]
  critic_warmup_updates: 30        # fresh critic (new obs layout) learns before the actor moves

league:
  pool_size: 24                    # frozen snapshots kept (the first `anchors` are never overwritten)
  anchors: 1                       # pool0 = the initial (M3) policy: regression anchor
  snapshot_steps: 50_000_000
  fixed_share: 0.3                 # share of episodes against stationary + FSMs, so old skills stay
  pfsp_power: 2.0                  # weight ∝ (1 − win_rate)^p: focus on opponents we lose to
  pfsp_floor: 0.02                 # keep a little weight on opponents already beaten
  win_ema: 0.01                    # per-episode EMA rate for the win-rate estimates

eval:
  every_steps: 100_000_000
  matches: 1024
  video_matches: 6
