[project]
name = "robosumo-rl"
version = "0.1.0"
description = "RL policy for a 3 kg robot sumo: batched 2D GPU sim, PPO, export to an ESP32/STM32 robot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "numpy",
    "pyyaml",
    "tensorboard",
    "matplotlib",
    "pygame",
    "mujoco>=3.17.0",
    "warp-lang>=1.18.0",
    "mujoco-warp>=3.17.0",
]

[dependency-groups]
dev = ["pytest"]
tools = [
    "cascadio>=0.1.1",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "trimesh>=5.2.0",
]

[tool.uv]
package = false
default-groups = ["dev", "tools"]  # tools: STEP → mesh pipeline (sim3d assets)

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
